name: Kremen checks
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build compiler and bootstrap
        run: make all selfhost
      - name: Regression and installation checks
        run: make test test-install
      - name: Portable C profile
        run: make USE_ASM=0 all check
      - name: Verify source archives
        run: |
          KREMEN_RELEASE_VERSION=$(cat VERSION)
          make dist
          cd ..
          sha256sum -c "kremen-v$KREMEN_RELEASE_VERSION.sha256"
          mkdir "release check"
          tar -xzf "kremen-v$KREMEN_RELEASE_VERSION.tar.gz" -C "release check"
          cd "release check/kremen"
          sha256sum -c SHA256SUMS
          make all selfhost check
  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ASAN_OPTIONS: detect_leaks=0
      UBSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - name: Address and undefined behavior sanitizers
        run: make test-sanitize
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: msys2 {0}
    env:
      CC: gcc
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            diffutils
            mingw-w64-ucrt-x86_64-gcc
      - name: Build and exercise native Windows tools
        run: make all test-windows
